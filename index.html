<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My API Project</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f4f8;
    text-align: center;
    padding: 50px;
  }

  h1 {
    color: #2c3e50;
  }

  input {
    padding: 10px;
    width: 250px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
  }

  button {
    padding: 10px 20px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background-color: #2980b9;
  }

  #result {
    margin-top: 30px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    display: inline-block;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

  <h1>My API Dashboard</h1>
  <input type="text" id="city" placeholder="Enter city name" />
  <button onclick="getWeather()">Get Weather</button>
  <div id="result">
    <p>Search a city to see weather!</p>
  </div>
  <br><br>

<h2>📰 Latest Tech News</h2>
<button onclick="getNews()">Load News</button>

<div id="news">
  <p>Click the button to load news!</p>
</div>
  <script>
    async function getNews() {
  document.getElementById('news').innerHTML = '<p>⏳ Loading news...</p>';

  try {
    const res = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
    const ids = await res.json();

    const top5 = ids.slice(0, 5);

    let newsHTML = '';

    for (let id of top5) {
      const storyRes = await fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`);
      const story = await storyRes.json();

      newsHTML += `<p>🔗 <a href="${story.url}" target="_blank">${story.title}</a></p>`;
    }

    document.getElementById('news').innerHTML = newsHTML;

  } catch (error) {
    document.getElementById('news').innerHTML = '<p>Failed to load news!</p>';
  }
}
  async function getWeather() {
    const city = document.getElementById('city').value;

    if (city === '') {
        document.getElementById('result').innerHTML = '<P>please enter a city name!</p>';
            return;
    }
    try {

    document.getElementById('result').innerHTML = '<p>⏳ Loading...</p>';
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`);
    const geoData = await geoRes.json();
    
    const lat = geoData.results[0].latitude;
    const lon = geoData.results[0].longitude;
    const name = geoData.results[0].name;
    
    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`);
    const weatherData = await weatherRes.json();
    
    const temp = weatherData.current.temperature_2m;
    const humidity = weatherData.current.relative_humidity_2m;
    const wind = weatherData.current.wind_speed_10m;
    
    document.getElementById('result').innerHTML = `
      <p>City: ${name}</p>
      <p>Temperature: ${temp}°C</p>
      <p>Humidity:${humidity}%</p>
      <p>Wind Speed: ${wind} km/h</p>
    `;
  } catch (error) {
    document.getElementById('result').innerHTML = '<p>City not found! Please try again.</p>';
   }
  }
</script>
</body>
</html>
